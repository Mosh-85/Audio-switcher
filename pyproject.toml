[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-switcher"
version = "0.1.0"
description = "Switch audio output/input device groups from the KDE Plasma tray"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = ["PySide6>=6.6"]

[project.scripts]
audio-switcher = "audioswitcher.app:main"
audio-switcher-ctl = "audioswitcher.cli:main"

[tool.setuptools]
packages = ["audioswitcher"]

[tool.setuptools.package-data]
audioswitcher = ["qml/*.qml"]
